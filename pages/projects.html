<section class="projects-page">

    <!-- Projects Header -->
    <div class="projects-header">

        <h2>MY PROJECTS</h2>

        <div class="projects-header-actions">

            <p>
                Overview of all active development environments
                and personal repositories.
            </p>

            <div class="projects-header-buttons">

                <button class="add-project">
                    <i data-lucide="plus"></i>
                    <span>ADD PROJECT</span>
                </button>


                <div class="project-status-filter">

                    <i data-lucide="chart-column"></i>

                    <label for="project-status">
                        Status:
                    </label>

                    <select
                        name="project-status"
                        id="project-status"
                    >
                        <option value="all">All</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                        <option value="planned">Planned</option>
                    </select>

                </div>


                <button class="projects-filter">
                    <i data-lucide="list-filter"></i>
                    <span>FILTER</span>
                    
                </button>

            </div>

        </div>

    </div>


    <!-- Projects Cards -->
    <section class="projects-cards"></section>

</section>
