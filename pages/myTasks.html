<section class="task-page">

     <!-- Tasks Header -->
    <div class="tasks-header">

        <h2>MY Tasks</h2>

        <div class="tasks-header-actions">

            <p>
                Manage and prioritize your workflow.
            </p>

            <div class="tasks-header-buttons">

                


                <div class="tasks-project-filter">

                    <i data-lucide="chart-column"></i>

                    <label for="tasks-project">
                        Project:
                    </label>

                    <select
                        name="tasks-project"
                        id="tasks-project"
                    >
                        <option value="all">All</option>
                        <option value="backend">backend</option>
                        <option value="frontend">frontend</option>
                        <option value="core engine">core engine</option>
                    </select>

                </div>



                <button class="tasks-filter">
                    <i data-lucide="list-filter"></i>
                    <span>FILTER</span>
                    
                </button>



                <button class="add-task-page">
                    <i data-lucide="plus"></i>
                    <span>ADD TASK</span>
                </button>

            </div>

        </div>

    </div>



    <!-- Tasks Cards -->
     <section class="tasks-place">
        <div class="tasks-cards">
            <div class="tasks-place-header">
                <h3>All Tasks</h3>
                <span>30</span>
            </div>
            <div class="tasks-place-content"></div>
        </div>

        <div class="tasks-tomorrow">
        </div>


     </section>

        

</section>
